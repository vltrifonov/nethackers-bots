name: NetHackers trace ranger-gnome-rothe-ward-context

on:
  push:
    branches: [codex/frontier-diagnostics/ranger-gnome-rothe-ward-context]

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [14]
    env:
      ARM: ranger-gnome-rothe-ward-context
      BOT_REPOSITORY: daglar-dragomirov/nethacker
      BOT_COMMIT: 9c7f87e1d9d3e859e895246f85c5e4d2ac870c25
      OBJECTIVE: ran-gno-neu-mal
      SEED: ${{ matrix.seed }}
    steps:
      - name: Run the pinned NetHackers arena
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/bots"
          git -C "$RUNNER_TEMP/bots" fetch --quiet --depth 1 "https://github.com/$BOT_REPOSITORY.git" "$BOT_COMMIT"
          test "$(git -C "$RUNNER_TEMP/bots" rev-parse FETCH_HEAD)" = "$BOT_COMMIT"
          mkdir -p "$RUNNER_TEMP/solution" "$RUNNER_TEMP/evidence"
          git -C "$RUNNER_TEMP/bots" archive "$BOT_COMMIT" | tar -xf - -C "$RUNNER_TEMP/solution"
          python3 -m venv "$RUNNER_TEMP/nethackers"
          "$RUNNER_TEMP/nethackers/bin/pip" install --quiet 'git+https://github.com/dunnolab/nethackers.git@fdea69aeeecd1f561d9f29eaccf9510ec1e743de'
          git init --quiet "$RUNNER_TEMP/campaign"
          git -C "$RUNNER_TEMP/campaign" fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/campaign" show "$GITHUB_SHA:change.patch" > "$RUNNER_TEMP/change.patch"
          git -C "$RUNNER_TEMP/solution" -c core.whitespace=cr-at-eol apply "$RUNNER_TEMP/change.patch"
          git -C "$RUNNER_TEMP/campaign" show "$GITHUB_SHA:diagnose_one.py" > "$RUNNER_TEMP/diagnose_one.py"
          git -C "$RUNNER_TEMP/campaign" show "$GITHUB_SHA:arena_public_trace.py" > "$RUNNER_TEMP/arena_public_trace.py"
          "$RUNNER_TEMP/nethackers/bin/python" "$RUNNER_TEMP/diagnose_one.py" "$RUNNER_TEMP/solution" "$RUNNER_TEMP/evidence" "$OBJECTIVE" "$SEED" "$RUNNER_TEMP/arena_public_trace.py"
          printf '%s\n' "$BOT_COMMIT" > "$RUNNER_TEMP/evidence/source-commit.txt"
      - name: Save diagnostic output
        shell: bash
        working-directory: ${{ runner.temp }}/evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=results
          git add diagnostic.json source-commit.txt
          if [[ -f bot-tail.txt ]]; then git add bot-tail.txt; fi
          if [[ -f arena-observations.json ]]; then git add arena-observations.json; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m "Samurai gameplay diagnostics evidence for $OBJECTIVE"
          git -c credential.helper= \
            -c 'credential.helper=!credential() { printf "username=x-access-token\npassword=%s\n" "$GITHUB_TOKEN"; }; credential' \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/codex/frontier-trace/ranger-gnome-rothe-ward-context/$SEED"
